<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonie Music - Stream Hardtekk & Electronic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00f2fe',
                            purple: '#7928ca',
                            pink: '#ff0080',
                            dark: '#0a0a0f',
                            card: 'rgba(255, 255, 255, 0.05)',
                            border: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #08080c;
            background-image: 
                radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(0, 242, 254, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 128, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #e2e8f0;
        }

        .glass-panel {
            background: rgba(18, 18, 26, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 242, 254, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(0, 242, 254, 0.2);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 242, 254, 0.4);
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #00f2fe;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
            margin-top: -5px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between overflow-x-hidden text-slate-100">

    <div class="flex flex-1 pb-36 md:pb-32">
        <!-- Sidebar Navigation -->
        <aside class="hidden md:flex flex-col w-64 glass-panel border-r border-white/10 p-6 z-20">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-purple via-brand-pink to-brand-cyan p-0.5 flex items-center justify-center shadow-lg shadow-brand-purple/30">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid fa-compact-disc text-brand-cyan text-xl animate-spin" style="animation-duration: 8s;"></i>
                    </div>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-wider bg-gradient-to-r from-brand-cyan via-white to-brand-pink bg-clip-text text-transparent">
                        HARMONIE
                    </h1>
                    <span class="text-[10px] uppercase tracking-widest text-slate-400 block -mt-1">Music Studio</span>
                </div>
            </div>

            <nav class="space-y-6">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-3">Menu</p>
                    <div class="space-y-1">
                        <a href="#" onclick="filterCategory('ALL', this)" class="menu-link active flex items-center gap-3 px-3 py-2.5 rounded-xl bg-brand-cyan/10 text-brand-cyan font-medium transition-all">
                            <i class="fa-solid fa-house w-5"></i> Découvrir
                        </a>
                        <a href="#" onclick="filterCategory('FAVORITES', this)" class="menu-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-brand-pink hover:bg-brand-pink/10 font-medium transition-all">
                            <i class="fa-solid fa-heart w-5"></i> Mes Favoris
                        </a>
                    </div>
                </div>

                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-3">Genres</p>
                    <div class="space-y-1" id="sidebar-categories">
                        <button onclick="filterCategory('HARDTEKK', this)" class="menu-link w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-brand-cyan hover:bg-brand-cyan/10 transition-all">
                            <span class="flex items-center gap-2"><i class="fa-solid fa-bolt"></i> HARDTEKK</span>
                            <span class="text-xs bg-white/5 px-2 py-0.5 rounded-full">6</span>
                        </button>
                        <button onclick="filterCategory('ELECTRO', this)" class="menu-link w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-brand-cyan hover:bg-brand-cyan/10 transition-all">
                            <span class="flex items-center gap-2"><i class="fa-solid fa-sliders"></i> ELECTRO</span>
                            <span class="text-xs bg-white/5 px-2 py-0.5 rounded-full">4</span>
                        </button>
                        <button onclick="filterCategory('DEEP HOUSE', this)" class="menu-link w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-brand-cyan hover:bg-brand-cyan/10 transition-all">
                            <span class="flex items-center gap-2"><i class="fa-solid fa-cloud-moon"></i> DEEP HOUSE</span>
                            <span class="text-xs bg-white/5 px-2 py-0.5 rounded-full">1</span>
                        </button>
                    </div>
                </div>
            </nav>
        </aside>

        <main class="flex-1 p-4 md:p-8 overflow-y-auto custom-scrollbar">
            <!-- Search Header -->
            <header class="flex items-center justify-between gap-4 mb-8">
                <div class="relative flex-1 max-w-md">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" onkeyup="searchTracks()" placeholder="Rechercher un titre, artiste..." class="w-full bg-slate-900/60 border border-white/10 rounded-2xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-brand-cyan/50 focus:ring-2 focus:ring-brand-cyan/20 transition-all text-white placeholder-slate-500 backdrop-blur-md">
                </div>
            </header>

            <!-- Status Banner for Audio Errors -->
            <div id="error-toast" class="hidden mb-6 p-4 rounded-2xl bg-rose-500/20 border border-rose-500/40 text-rose-200 text-xs md:text-sm flex items-center justify-between gap-3 shadow-lg">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-triangle-exclamation text-rose-400 text-lg"></i>
                    <span id="error-toast-text">Erreur de lecture audio.</span>
                </div>
                <button onclick="dismissError()" class="px-2 py-1 rounded-lg bg-rose-500/30 hover:bg-rose-500/50 text-white font-bold text-xs">Fermer</button>
            </div>

            <!-- Category Pills (mobile & desktop) -->
            <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 custom-scrollbar">
                <button onclick="filterCategory('ALL', this)" class="pill-btn active px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-brand-cyan text-slate-950 font-bold shadow-md shadow-brand-cyan/20 transition-all">
                    Tous (11)
                </button>
                <button onclick="filterCategory('FAVORITES', this)" class="pill-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-white/5 border border-white/10 text-slate-300 hover:text-brand-pink hover:border-brand-pink/30 transition-all">
                    💖 Mes Favoris
                </button>
                <button onclick="filterCategory('HARDTEKK', this)" class="pill-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-white/5 border border-white/10 text-slate-300 hover:text-white transition-all">
                    ⚡ HARDTEKK (6)
                </button>
                <button onclick="filterCategory('ELECTRO', this)" class="pill-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-white/5 border border-white/10 text-slate-300 hover:text-white transition-all">
                    🎛️ ELECTRO (4)
                </button>
            </div>

            <!-- Track Section Header -->
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-white flex items-center gap-2" id="section-title">
                    <i class="fa-solid fa-compact-disc text-brand-cyan"></i> Pistes Générales
                </h3>
                <span id="track-count" class="text-xs text-slate-400 font-medium">11 titres disponibles</span>
            </div>

            <!-- Track Grid -->
            <div id="track-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                <!-- Les cartes sont générées dynamiquement en Javascript -->
            </div>
        </main>
    </div>

    <!-- Player Footer -->
    <footer class="fixed bottom-0 left-0 right-0 glass-panel border-t border-white/10 px-4 py-3 md:px-8 md:py-4 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            
            <div class="flex items-center gap-4 w-full md:w-1/4">
                <div class="relative w-12 h-12 md:w-14 md:h-14 rounded-xl overflow-hidden bg-slate-800 border border-white/10 flex-shrink-0 group">
                    <img id="player-cover" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&q=80" alt="Cover" class="w-full h-full object-cover" onerror="handleImageError(this, 'HARMONIE')">
                    <div id="cover-spinner" class="absolute inset-0 bg-slate-950/60 hidden items-center justify-center">
                        <i class="fa-solid fa-compact-disc text-brand-cyan text-xl animate-spin"></i>
                    </div>
                </div>
                <div class="overflow-hidden">
                    <h4 id="player-title" class="font-bold text-sm text-white truncate">Sélectionnez un titre</h4>
                    <p id="player-artist" class="text-xs text-slate-400 truncate">Cliquez sur une piste pour lancer</p>
                </div>
            </div>

            <div class="flex flex-col items-center gap-2 w-full md:w-2/4">
                <canvas id="visualizer" class="w-full h-10 rounded-lg bg-slate-950/60 border border-white/10 mb-1"></canvas>

                <div class="flex items-center gap-5">
                    <button onclick="toggleShuffle()" id="shuffle-btn" class="text-slate-400 hover:text-white transition-colors text-sm" title="Lecture aléatoire">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button onclick="playPrevious()" class="text-slate-300 hover:text-brand-cyan transition-colors text-base" title="Précédent">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button onclick="togglePlay()" id="play-btn" class="w-11 h-11 rounded-full bg-gradient-to-r from-brand-cyan to-blue-600 text-slate-950 flex items-center justify-center hover:scale-105 transition-all shadow-lg shadow-brand-cyan/30">
                        <i class="fa-solid fa-play text-lg pl-0.5"></i>
                    </button>
                    <button onclick="playNext()" class="text-slate-300 hover:text-brand-cyan transition-colors text-base" title="Suivant">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                    <button onclick="toggleRepeat()" id="repeat-btn" class="text-slate-400 hover:text-white transition-colors text-sm" title="Répéter">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                </div>

                <div class="flex items-center gap-3 w-full max-w-md">
                    <span id="current-time" class="text-[11px] font-mono text-slate-400 w-9 text-right">0:00</span>
                    <input type="range" id="seek-bar" value="0" max="100" class="flex-1" oninput="seekAudio(this.value)">
                    <span id="total-time" class="text-[11px] font-mono text-slate-400 w-9">0:00</span>
                </div>
            </div>

            <div class="hidden md:flex items-center justify-end gap-3 w-1/4">
                <button onclick="toggleMute()" id="mute-btn" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <input type="range" id="volume-bar" value="80" max="100" class="w-24" oninput="setVolume(this.value)">
            </div>
        </div>
    </footer>

    <audio id="audio-element" crossorigin="anonymous" preload="auto"></audio>

    <script>
        const fallbackCovers = [
            "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&q=80",
            "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=500&q=80",
            "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80",
            "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&q=80",
            "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=500&q=80"
        ];

        const tracks = [
            { id: 1, title: "Breaking Me", artist: "Topic, A7S", category: "ELECTRO", cover: "./thumb_Breaking Me.png", fallbackCover: fallbackCovers[0], fileName: "Breaking Me.mp3" },
            { id: 2, title: "CARAMEL JESTER - UMBRELLA", artist: "Caramel Jester", category: "HARDTEKK", cover: "./thumb_CARAMEL JESTER - UMBRELLA.png", fallbackCover: fallbackCovers[1], fileName: "CARAMEL JESTER - UMBRELLA(HARDTEKK).mp3" },
            { id: 3, title: "COOL (HARDTEKK)", artist: "Hardtekk Artist", category: "HARDTEKK", cover: "./thumb_COOL.png", fallbackCover: fallbackCovers[2], fileName: "COOL(HARDTEKK).mp3" },
            { id: 4, title: "Eins Zwei Polizei (HARDTEKK)", artist: "Mo-Do Remix", category: "HARDTEKK", cover: "./thumb_Eins Zwei Polizei.png", fallbackCover: fallbackCovers[3], fileName: "Eins Zwei Polizei(HARDTEKK).mp3" },
            { id: 5, title: "In my mind", artist: "Dynoro, Gigi D'Agostino", category: "ELECTRO", cover: "./thumb_in my mind.png", fallbackCover: fallbackCovers[4], fileName: "In my mind.mp3" },
            { id: 6, title: "Monster", artist: "LUM!X, Gabry Ponte", category: "ELECTRO", cover: "./thumb_Monster.png", fallbackCover: fallbackCovers[0], fileName: "Monster.mp3" },
            { id: 7, title: "ON THE FLOOR (HARDTEKK)", artist: "Hardtekk Remix", category: "HARDTEKK", cover: "./thumb_ON THE FLOOR.png", fallbackCover: fallbackCovers[1], fileName: "ON THE FLOOR(HARDTEKK).mp3" },
            { id: 8, title: "Piece Of Your Heart", artist: "Meduza", category: "DEEP HOUSE", cover: "./thumb_Piece Of Your Heart.png", fallbackCover: fallbackCovers[2], fileName: "Piece Of Your Heart.mp3" },
            { id: 9, title: "Roses", artist: "SAINt JHN", category: "ELECTRO", cover: "./thumb_roses.png", fallbackCover: fallbackCovers[3], fileName: "Roses.mp3" },
            { id: 10, title: "SOMETIMES (HARDTEKK)", artist: "Hardtekk Producer", category: "HARDTEKK", cover: "./thumb_SOMETIMES.png", fallbackCover: fallbackCovers[4], fileName: "SOMETIMES(HARDTEKK).mp3" },
            { id: 11, title: "UNDRESS REHEARSAL (HARDTEKK)", artist: "Hardtekk Producer", category: "HARDTEKK", cover: "./thumb_UNDRESS REHEARSAL.png", fallbackCover: fallbackCovers[0], fileName: "UNDRESS REHEARSAL(HARDTEKK).mp3" }
        ];

        // --- GESTION DES FAVORIS ---
        // On récupère les favoris enregistrés, ou on crée un tableau vide
        let favoriteIds = JSON.parse(localStorage.getItem('harmonie_favorites')) || [];

        function toggleFavorite(event, trackId) {
            event.stopPropagation(); // Empêche de lancer la musique quand on clique sur le cœur
            
            if (favoriteIds.includes(trackId)) {
                // Retirer des favoris
                favoriteIds = favoriteIds.filter(id => id !== trackId);
            } else {
                // Ajouter aux favoris
                favoriteIds.push(trackId);
            }
            
            // Sauvegarder dans le navigateur
            localStorage.setItem('harmonie_favorites', JSON.stringify(favoriteIds));
            
            // Recharger l'affichage
            renderTracks();
        }

        let currentTrackIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let currentFilter = 'ALL'; 

        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const playerTitle = document.getElementById('player-title');
        const playerArtist = document.getElementById('player-artist');
        const playerCover = document.getElementById('player-cover');
        const coverSpinner = document.getElementById('cover-spinner');
        const seekBar = document.getElementById('seek-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');

        let audioCtx = null;
        let analyser = null;
        let audioSource = null;
        let dataArray = null;

        function handleImageError(img, trackTitle = 'HARMONIE', fallbackUrl = '') {
            img.onerror = null;
            if (fallbackUrl && img.src !== fallbackUrl) {
                img.src = fallbackUrl;
                return;
            }
            const parent = img.parentElement;
            if (parent) {
                img.style.display = 'none';
                let existingFallback = parent.querySelector('.gradient-cover-fallback');
                if (!existingFallback) {
                    const fallbackDiv = document.createElement('div');
                    fallbackDiv.className = 'gradient-cover-fallback absolute inset-0 w-full h-full bg-gradient-to-br from-brand-purple/80 via-slate-900 to-brand-cyan/80 flex flex-col items-center justify-center p-3 text-center border border-white/10 z-0';
                    fallbackDiv.innerHTML = `
                        <div class="w-10 h-10 rounded-xl bg-brand-cyan/20 border border-brand-cyan/40 flex items-center justify-center mb-1 text-brand-cyan">
                            <i class="fa-solid fa-compact-disc text-lg animate-spin" style="animation-duration: 10s;"></i>
                        </div>
                        <span class="text-[11px] font-bold text-white leading-tight uppercase truncate max-w-full">${trackTitle}</span>
                    `;
                    parent.appendChild(fallbackDiv);
                }
            }
        }

        function initAudioContext() {
            if (!audioCtx) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 128;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    
                    audioSource = audioCtx.createMediaElementSource(audio);
                    audioSource.connect(analyser);
                    analyser.connect(audioCtx.destination);
                } catch (e) {
                    console.warn('Web Audio API not fully supported', e);
                }
            }
        }

        function loadTrack(index, autoplay = true) {
            if (index < 0 || index >= tracks.length) return;
            currentTrackIndex = index;
            const track = tracks[index];

            playerTitle.textContent = track.title;
            playerArtist.textContent = track.artist;
            playerCover.style.display = 'block';
            playerCover.src = track.cover;
            
            const existingFallback = playerCover.parentElement.querySelector('.gradient-cover-fallback');
            if (existingFallback) existingFallback.remove();

            audio.src = track.fileName; 
            audio.load();

            coverSpinner.classList.remove('hidden');
            coverSpinner.classList.add('flex');

            if (autoplay) {
                initAudioContext();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayButtonUI();
                    coverSpinner.classList.add('hidden');
                    coverSpinner.classList.remove('flex');
                }).catch(err => {
                    coverSpinner.classList.add('hidden');
                    coverSpinner.classList.remove('flex');
                    isPlaying = false;
                    updatePlayButtonUI();
                });
            }
            renderTracks();
        }

        function togglePlay() {
            if (currentTrackIndex === -1) {
                loadTrack(0, true);
                return;
            }
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    isPlaying = true;
                });
            }
            updatePlayButtonUI();
        }

        function updatePlayButtonUI() {
            playBtn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause text-lg"></i>' : '<i class="fa-solid fa-play text-lg pl-0.5"></i>';
        }

        function playNext() {
            if (tracks.length === 0) return;
            let nextIndex = isShuffle ? Math.floor(Math.random() * tracks.length) : (currentTrackIndex + 1) % tracks.length;
            loadTrack(nextIndex, true);
        }

        function playPrevious() {
            if (tracks.length === 0) return;
            let prevIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(prevIndex, true);
        }

        function seekAudio(val) {
            if (!audio.duration) return;
            audio.currentTime = (val / 100) * audio.duration;
        }

        function setVolume(val) {
            audio.volume = val / 100;
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            const muteBtn = document.getElementById('mute-btn');
            muteBtn.innerHTML = audio.muted ? '<i class="fa-solid fa-volume-xmark text-rose-400"></i>' : '<i class="fa-solid fa-volume-high"></i>';
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffle-btn').className = isShuffle ? 'text-brand-cyan transition-colors text-sm' : 'text-slate-400 hover:text-white transition-colors text-sm';
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeat-btn').className = isRepeat ? 'text-brand-cyan transition-colors text-sm' : 'text-slate-400 hover:text-white transition-colors text-sm';
        }

        function filterCategory(cat, btnElement) {
            currentFilter = cat;

            // Mise à jour visuelle des boutons "Pill"
            document.querySelectorAll('.pill-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-brand-cyan', 'text-slate-950', 'font-bold', 'shadow-md', 'shadow-brand-cyan/20');
                btn.classList.add('bg-white/5', 'border', 'border-white/10', 'text-slate-300');
            });
            
            // Mise à jour du titre de la section
            let titleHtml = '';
            if(cat === 'FAVORITES') titleHtml = '<i class="fa-solid fa-heart text-brand-pink"></i> Mes Favoris';
            else if(cat === 'ALL') titleHtml = '<i class="fa-solid fa-compact-disc text-brand-cyan"></i> Pistes Générales';
            else titleHtml = `<i class="fa-solid fa-music text-brand-cyan"></i> Pistes ${cat}`;
            
            document.getElementById('section-title').innerHTML = titleHtml;

            renderTracks();
        }

        function searchTracks() { renderTracks(); }

        function renderTracks() {
            const grid = document.getElementById('track-grid');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            const filtered = tracks.filter(t => {
                // Logique de filtrage (Catégorie + Favoris + Recherche)
                let categoryMatch = false;
                if (currentFilter === 'ALL') categoryMatch = true;
                else if (currentFilter === 'FAVORITES') categoryMatch = favoriteIds.includes(t.id);
                else categoryMatch = (t.category === currentFilter);

                let searchMatch = t.title.toLowerCase().includes(searchVal) || t.artist.toLowerCase().includes(searchVal);
                
                return categoryMatch && searchMatch;
            });

            document.getElementById('track-count').textContent = `${filtered.length} titre${filtered.length > 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center glass-card rounded-2xl">
                        <i class="fa-${currentFilter === 'FAVORITES' ? 'regular fa-heart' : 'solid fa-music'} text-3xl text-slate-500 mb-3"></i>
                        <p class="text-slate-300 font-semibold text-sm">
                            ${currentFilter === 'FAVORITES' ? "Vous n'avez pas encore de favoris." : "Aucune piste trouvée"}
                        </p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(track => {
                const isCurrent = currentTrackIndex === track.id - 1;
                const isFav = favoriteIds.includes(track.id); // Vérifie si la musique est dans les favoris

                return `
                    <div onclick="loadTrack(${track.id - 1}, true)" class="glass-card rounded-2xl p-4 cursor-pointer group relative overflow-hidden flex flex-col justify-between ${isCurrent ? 'border-brand-cyan/60 bg-white/10 shadow-lg shadow-brand-cyan/10' : ''}">
                        
                        <!-- Bouton Favoris -->
                        <button onclick="toggleFavorite(event, ${track.id})" class="absolute top-6 left-6 z-10 w-8 h-8 rounded-full bg-slate-900/70 backdrop-blur-md flex items-center justify-center hover:scale-110 transition-all ${isFav ? 'text-brand-pink shadow-[0_0_10px_rgba(255,0,128,0.3)]' : 'text-slate-400 hover:text-brand-pink'}">
                            <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>
                        </button>

                        <div class="relative w-full aspect-square rounded-xl overflow-hidden bg-slate-900 mb-3">
                            <img src="${track.cover}" alt="${track.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="handleImageError(this, '${track.title.replace(/'/g, "\\'")}', '${track.fallbackCover}')">
                            <div class="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <div class="w-12 h-12 rounded-full bg-brand-cyan text-slate-950 flex items-center justify-center shadow-lg transform translate-y-2 group-hover:translate-y-0 transition-all">
                                    <i class="fa-solid ${isCurrent && isPlaying ? 'fa-pause' : 'fa-play'} text-lg pl-0.5"></i>
                                </div>
                            </div>
                            ${isCurrent ? `
                                <div class="absolute bottom-2 right-2 px-2 py-1 rounded-lg bg-brand-cyan/90 text-slate-950 text-[10px] font-extrabold uppercase tracking-wider flex items-center gap-1 shadow-md">
                                    <span class="w-1.5 h-1.5 rounded-full bg-slate-950 animate-ping"></span> En cours
                                </div>
                            ` : ''}
                        </div>
                        <div>
                            <span class="text-[10px] font-bold text-brand-cyan uppercase tracking-wider block mb-1">${track.category}</span>
                            <h4 class="font-bold text-sm text-white truncate mb-0.5 group-hover:text-brand-cyan transition-colors">${track.title}</h4>
                            <p class="text-xs text-slate-400 truncate">${track.artist}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            seekBar.value = (audio.currentTime / audio.duration) * 100;
            let curM = Math.floor(audio.currentTime / 60);
            let curS = Math.floor(audio.currentTime % 60);
            currentTimeEl.textContent = `${curM}:${curS < 10 ? '0' : ''}${curS}`;
            let durM = Math.floor(audio.duration / 60);
            let durS = Math.floor(audio.duration % 60);
            totalTimeEl.textContent = `${durM}:${durS < 10 ? '0' : ''}${durS}`;
        });

        audio.addEventListener('ended', () => {
            isRepeat ? (audio.currentTime = 0, audio.play()) : playNext();
        });

        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const width = canvas.width;
            const height = canvas.height;
            canvasCtx.clearRect(0, 0, width, height);

            if (!isPlaying || !analyser) {
                canvasCtx.fillStyle = 'rgba(0, 242, 254, 0.2)';
                canvasCtx.fillRect(0, height / 2 - 1, width, 2);
                return;
            }

            analyser.getByteFrequencyData(dataArray);

            const barWidth = (width / dataArray.length) * 2.5;
            let x = 0;
            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * height;
                const gradient = canvasCtx.createLinearGradient(0, height, 0, 0);
                gradient.addColorStop(0, '#7928ca');
                gradient.addColorStop(0.5, '#00f2fe');
                gradient.addColorStop(1, '#ff0080');
                canvasCtx.fillStyle = gradient;
                canvasCtx.fillRect(x, height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
                if (x > width) break;
            }
        }

        renderTracks();
        drawVisualizer();
    </script>
</body>
</html>
